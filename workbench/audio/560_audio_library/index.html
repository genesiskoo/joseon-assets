function render(){const q=$('search').value.trim().toLowerCase();visible=data.filter(d=>(!category||d.category===category)&&(!$('origin').value||d.origin===$('origin').value)&&(!$('speaker').value||d.speaker===$('speaker').value)&&(!q||[d.title,d.detail,d.speaker].join(' ').toLowerCase().includes(q)));$('count').textContent=visible.length+'개 · 총 '+time(visible.reduce((n,d)=>n+d.duration,0));$('playall').disabled=!visible.length;$('list').innerHTML=visible.length?visible.map(d=>`<article class="row ${current===d.id?'playing':''}" data-id="${d.id}"><span class="tag">${d.category}</span><div><div class="title">${esc(d.title)}</div><div class="detail">${esc(d.detail)} · ${time(d.duration)}</div></div><span class="speaker">${d.speaker||'—'}</span><span class="origin">${d.origin}</span><button data-play="${d.id}" aria-label="재생 ${esc(d.speaker?d.speaker+' '+d.title:d.title)}">▶ 재생</button></article>`).join(''):'<div id="empty">검색 결과가 없습니다.</div>';}
function buttons(){$('prev').disabled=pos<=0;$('next').disabled=pos<0||pos>=queue.length-1;}
async function play(id){const d=data.find(d=>d.id===id);if(!d)return;current=id;$('now').textContent=(d.speaker?d.speaker+' · ':'')+d.title;$('status').textContent=(pos+1)+' / '+queue.length;audio.src=d.path;render();buttons();try{await audio.play()}catch(e){$('status').textContent='재생 실패 · 다시 재생을 눌러 주세요';}}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;category=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').addEventListener('input',render);$('origin').addEventListener('change',render);$('speaker').addEventListener('change',render);
$('list').addEventListener('click',e=>{const b=e.target.closest('[data-play]');if(!b)return;queue=[Number(b.dataset.play)];pos=0;play(queue[pos])});$('playall').onclick=()=>{queue=visible.map(d=>d.id);pos=0;if(queue.length)play(queue[0])};$('prev').onclick=()=>{if(pos>0)play(queue[--pos])};$('next').onclick=()=>{if(pos<queue.length-1)play(queue[++pos])};$('stop').onclick=()=>{audio.pause();audio.currentTime=0;queue=[];pos=-1;current=null;$('now').textContent='재생을 정지했습니다';$('status').textContent='';buttons();render()};audio.onended=()=>{if(pos<queue.length-1)play(queue[++pos]);else $('status').textContent='목록 재생 완료'};audio.onerror=()=>{$('status').textContent='파일을 재생할 수 없습니다. 항목을 확인해 주세요.'};render();
</script></body></html>
