<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>확정 성우 · 전체 대사</title><style>:root{color-scheme:dark}body{margin:0;background:#101311;color:#e9eddf;font:16px/1.6 "Malgun Gothic",sans-serif}main{max-width:1100px;margin:auto;padding:30px 24px 130px}h1{color:#d9b87a}a{color:#99c7a0}.box,article{background:#191e1a;padding:16px;margin:12px 0;border:1px solid #354036;border-radius:10px}button,input,select{font:inherit;color:inherit;background:#252d26;border:1px solid #354036;padding:8px 14px;border-radius:8px}button{cursor:pointer}.toolbar{display:flex;gap:12px;flex-wrap:wrap}input{flex:1}small{color:#a6b09e}.player{position:fixed;bottom:0;background:#1b231e;left:0;right:0;padding:12px 24px;display:flex;gap:15px;align-items:center}audio{width:500px;max-width:70vw}#now{font-size:13px}article p{margin:5px 0}article button{float:right}.cast{display:grid;grid-template-columns:1fr 1fr;gap:6px}@media(max-width:700px){.cast{grid-template-columns:1fr}.player{flex-wrap:wrap}}</style><main><small>JOSEON HUNTERS / FINAL CAST / 613</small><h1>선택한 목소리로 못골을 다시 듣자</h1><p>확정 성우의 전체 정적 대사 237줄 · Eleven v4 · 앞뒤 분기 문맥 포함.</p><div class="box"><b>최종 배정</b><div class="cast" id="cast"></div><small>2차 선택을 우선 적용합니다. 1차 오디션 선택 기록은 유지됩니다.</small></div><div class="toolbar"><select id="role"><option value="all">전체 인물</option></select><input id="search" placeholder="대사·ID 검색" aria-label="대사 검색"><button id="playall">검색된 대사 이어 듣기</button></div><p id="count"></p><div id="lines"></div><p><a href="../cast608/round2/">2차 오디션</a> · <a href="../cast608/">1차 오디션</a></p></main><div class="player"><span id="now">대사를 선택해 주세요.</span><audio controls id="audio" preload="none"></audio><button id="stop">정지</button></div><script id="payload" type="application/json">{"rows": [{"id": "EV_SHAMAN_QUEST_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "도사 양반, 늦었소. 못골이 석 달째 이 꼴이오.", "file": "audio/shaman/EV_SHAMAN_QUEST_1.mp3", "sha256": "1ba437e16ced18513ccbb39c0cb2287e0d8226fd8e93234bddc59b6fc3af0c2e"}, {"id": "EV_SHAMAN_QUEST_2", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "할매, 술부터… 아, 분위기 아니구먼.", "file": "audio/doho/EV_SHAMAN_QUEST_2.mp3", "sha256": "c0666604fc4cfac87a73241db06d7b2a1d5905be04594ca0d55039e7883650c9"}, {"id": "EV_SHAMAN_QUEST_3", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "봉인이 흔들리오. 요사한 기운이 못골로 새고 있소.", "file": "audio/shaman/EV_SHAMAN_QUEST_3.mp3", "sha256": "9a292780a41c59f397dacd4a040a76c4e9ac2942bd6daee9f92507335078533a"}, {"id": "EV_SHAMAN_QUEST_3B", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "꼬리 아홉 달린 천 년 묵은 여우, 구미호가 깨어났소.", "file": "audio/shaman/EV_SHAMAN_QUEST_3B.mp3", "sha256": "83d1a3dd5ad940307b24e0170ebad26314f916de1b307472677f38d6f1ce7c2d"}, {"id": "EV_SHAMAN_QUEST_3C", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "그 수하가 들녘 너머 흑랑 굴에 들어앉았소.", "file": "audio/shaman/EV_SHAMAN_QUEST_3C.mp3", "sha256": "201b1006f33424eee3283526f1f35aaa34f2f96c7529a9f92bec6eec8ae832e6"}, {"id": "EV_SHAMAN_QUEST_4", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "마을 북쪽 산길 끝 봉밀굴 문 안엔 구미호가 갇혀 있소. …아직 열 때가 아니오.", "file": "audio/shaman/EV_SHAMAN_QUEST_4.mp3", "sha256": "0267faea08af282edf5449bac028b1b2d0208c727e66047736cc6d38dd039d7a"}, {"id": "EV_SHAMAN_QUEST_5", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "…또 봉인이여.", "file": "audio/doho/EV_SHAMAN_QUEST_5.mp3", "sha256": "65a3b6c16f13bebce73e28c512ec8fc42cd6feeab4836251c05d0e1ec65ff5bf"}, {"id": "EV_SHAMAN_QUEST_6", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "도사 양반밖에 없소. 장터 어귀에 주모가 있소. 길은 그 사람이 아오.", "file": "audio/shaman/EV_SHAMAN_QUEST_6.mp3", "sha256": "e825d1ea39212e73180f329710e5b17f93ed0cbf394958360de15e6b8105a38e"}, {"id": "EV_SHAMAN_QUEST_7", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "술값은—", "file": "audio/doho/EV_SHAMAN_QUEST_7.mp3", "sha256": "d16ff73df7c795e07345f3ac0016028ddf7a4dad8e0cc38fae982a356a0253c2"}, {"id": "EV_SHAMAN_QUEST_8", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "살아서 돌아오면 쳐 드리리다.", "file": "audio/shaman/EV_SHAMAN_QUEST_8.mp3", "sha256": "c31d32cc46440e83139a09140108f57e250243415ab7b1e0174bed16e574433c"}, {"id": "EV_SHAMAN_QUEST_9", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "…허. 하는 김에.", "file": "audio/doho/EV_SHAMAN_QUEST_9.mp3", "sha256": "cf6da71920341b698482e1eac89f903640dfbe4b5ef3a25779ed7be0d42894cf"}, {"id": "NPC_DOKKAEBI_FIRST_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "오, 개 잡은 도사 양반이로군. 개 있는 동네엔 이사를 못 오는데, 덕분에 눌러앉게 됐지.", "file": "audio/dokkaebi/NPC_DOKKAEBI_FIRST_1.mp3", "sha256": "36f97bffb050cc87d05e226dd589bf08e64405f67f5e6e177f4a317ee16b020e"}, {"id": "NPC_DOKKAEBI_FIRST_2", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "도깨비도 이사를 다니는 줄은 몰랐구먼.", "file": "audio/doho/NPC_DOKKAEBI_FIRST_2.mp3", "sha256": "50752d72412ea24325f64e1d1c8296647197095973e60ac5fb9aef2603791252"}, {"id": "NPC_DOKKAEBI_FIRST_3", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "장터 뒤 대장간 터가 마음에 들어서 말이야. 나는 바꿔 주는 일을 해.", "file": "audio/dokkaebi/NPC_DOKKAEBI_FIRST_3.mp3", "sha256": "12a4a114278034fab9a5c4454db9aaf3ef52fba33173f4af355ed9df8886ac5d"}, {"id": "NPC_DOKKAEBI_FIRST_4", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "물건을 맡기면 다른 물건으로 바꿔 줘. 값은 그때그때 달라.", "file": "audio/dokkaebi/NPC_DOKKAEBI_FIRST_4.mp3", "sha256": "d503690353ee92e82cb4e16b011d69239cafa79691f81055c314ca9a26e33825"}, {"id": "NPC_DOKKAEBI_FIRST_5", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "바꿔 준다… 방망이로 금 나와라 뚝딱, 그건가?", "file": "audio/doho/NPC_DOKKAEBI_FIRST_5.mp3", "sha256": "e28239929371b0df71f536a7438969eb4f5f9c2382b38d6580c0ec7a1c897504"}, {"id": "NPC_DOKKAEBI_FIRST_6", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "뚝딱은 광고야. 실은 손으로 해. 그러니 값이 붙는 거고.", "file": "audio/dokkaebi/NPC_DOKKAEBI_FIRST_6.mp3", "sha256": "f1fbfd7d2f9c7e74b813e44fb64dd522f2bca3adb673ac8eaaf775b13c40732a"}, {"id": "NPC_DOKKAEBI_FIRST_7", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "첫 거래는 인사로 하지. 가방에서 쓰던 장비 아무거나 하나 내놔. 홈 둘 난 누비옷으로 바꿔 줄게.", "file": "audio/dokkaebi/NPC_DOKKAEBI_FIRST_7.mp3", "sha256": "2a558be0b9e1f54bdad5ba88a46919a5f54990cf94b57f4711fa46ecc50aec25"}, {"id": "NPC_DOKKAEBI_FIRST_8", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "아무거나? 값은 안 따지고?", "file": "audio/doho/NPC_DOKKAEBI_FIRST_8.mp3", "sha256": "bc9207e509d583599d9310a038f7d7797a8c51065aa26814672db88b9449af2b"}, {"id": "NPC_DOKKAEBI_FIRST_9", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "도깨비는 값을 안 따져. 비싼 걸 내놔도 누비옷, 싼 걸 내놔도 누비옷이야. 한 번뿐이니 잘 골라.", "file": "audio/dokkaebi/NPC_DOKKAEBI_FIRST_9.mp3", "sha256": "f9d55414d236f36e9ca8324edcf1cc29add798cee67c99aa10d824b0f436dc86"}, {"id": "NPC_DOKKAEBI_FIRST_10", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "안 쓰는 걸 내놓으면 되겠구먼.", "file": "audio/doho/NPC_DOKKAEBI_FIRST_10.mp3", "sha256": "5ee022b0e2248cf292ed4676e2faa1c50402fab14357c220381fb4268387b5a9"}, {"id": "NPC_DOKKAEBI_FIRST_11", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "그 말이야. 옷을 받으면 홈에 글자 부적을 박아. 순서가 중요해.", "file": "audio/dokkaebi/NPC_DOKKAEBI_FIRST_11.mp3", "sha256": "ff460cbcc3591ddeb97ef097c9c89b15c0d3c17c862b2f96fa139b51dbb49815"}, {"id": "NPC_DOKKAEBI_FIRST_12", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "수복 먼저, 강녕 다음이야. 거꾸로 박으면 아무 일도 안 일어나.", "file": "audio/dokkaebi/NPC_DOKKAEBI_FIRST_12.mp3", "sha256": "878713ebfa1bc46d14f2fe9b3d8aa1ea8ac8e2d24ecf85125dd3ce1f95aa251a"}, {"id": "NPC_DOKKAEBI_FIRST_13", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "글자 부적은 촌장네서 사례로 줄 거야. 먼저 받아 가.", "file": "audio/dokkaebi/NPC_DOKKAEBI_FIRST_13.mp3", "sha256": "a3f991c2b32774994a404246c1c67b50937b1bd0d659024b1ae5105755957853"}, {"id": "NPC_DOKKAEBI_FIRST_14", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "자, 골라 봐.", "file": "audio/dokkaebi/NPC_DOKKAEBI_FIRST_14.mp3", "sha256": "818235864c8549436109b99240411ca191246eb2fe497298b352ad19346370be"}, {"id": "NPC_DOKKAEBI_GREET2_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "또 왔네. 세상이 한 바퀴 돌아도 도깨비 장사는 그대로야.", "file": "audio/dokkaebi/NPC_DOKKAEBI_GREET2_1.mp3", "sha256": "e3d97f16996f439da2bf98f7a48a20309375650dc22db34956df2b87d2fa8332"}, {"id": "NPC_DOKKAEBI_GREET2_2", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "목로 쪽은 불이 꺼진 채네. …나야 그쪽 앞을 마음 놓고 지나다니게 됐지만.", "file": "audio/dokkaebi/NPC_DOKKAEBI_GREET2_2.mp3", "sha256": "2bc6c3a0b513aebaa70d57d3d8fcac939ece1c40cde327d26f106327317c31b6"}, {"id": "NPC_DOKKAEBI_GREET_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "왔어? 오늘은 뭘 바꿔 볼까.", "file": "audio/dokkaebi/NPC_DOKKAEBI_GREET_1.mp3", "sha256": "b1d55fada7324eab8742d0bee15a4cba9754fabb92392c0bd393b34b1ac5521c"}, {"id": "NPC_DOKKAEBI_GREET_2", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "쓰던 물건, 못 쓰는 물건, 주워 온 물건. 도깨비한텐 다 밑천이야.", "file": "audio/dokkaebi/NPC_DOKKAEBI_GREET_2.mp3", "sha256": "b19876f1378ad0252f880ef9ab2f45021f141b5fcb0cbdbaacbaa2b55065f239"}, {"id": "NPC_DOKKAEBI_GREET_3", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "틀려도 안 뺏어. 마음 놓고 올려 봐.", "file": "audio/dokkaebi/NPC_DOKKAEBI_GREET_3.mp3", "sha256": "9e42a1472c49cf4b01d72185abb40a7344f391dbc8532deb8d9721178fdc0c29"}, {"id": "NPC_DOKKAEBI_GREET_4", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "메밀묵 한 사발 곁들이면 마음이 너그러워지긴 해. …농담이야. 엽전이면 돼.", "file": "audio/dokkaebi/NPC_DOKKAEBI_GREET_4.mp3", "sha256": "60d79de4cf6d6a68a0a5ba34cd8a878fac3ee78c8648ff462b36a8b9ae31952f"}, {"id": "NPC_DOKKAEBI_GREET_5", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "이 동네에서 내가 제일 한가한 장사꾼이야. 손님이라곤 도사 양반뿐이니.", "file": "audio/dokkaebi/NPC_DOKKAEBI_GREET_5.mp3", "sha256": "2785e992a0eff88baa8a2354fb07d627ad68445db0e3f8af9b0264dad33b03dd"}, {"id": "NPC_DOKKAEBI_GREET_6", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "바꿀 거 있으면 올려 봐. 없으면 구경만 해도 돼. 구경값은 안 받아.", "file": "audio/dokkaebi/NPC_DOKKAEBI_GREET_6.mp3", "sha256": "593078fa8562d0c738483d19823b933041d3872120b420e5c3d6067806c2453d"}, {"id": "NPC_DOKKAEBI_CRAFT_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "어디 보자. 뭘 가져왔어?", "file": "audio/dokkaebi/NPC_DOKKAEBI_CRAFT_1.mp3", "sha256": "798f55f2eff6f5885565081949ff610544c6eccbbd207a731762bca005f94f0d"}, {"id": "NPC_DOKKAEBI_SWAP_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "그래, 장비 하나 내놔 봐. 누비옷은 어디 안 갔어.", "file": "audio/dokkaebi/NPC_DOKKAEBI_SWAP_1.mp3", "sha256": "e3a323d45ccf7bdd2a7b01eba48a011b674c4353584032a771f92b8c0ae614e4"}, {"id": "NPC_DOKKAEBI_ASK_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "뭐가 궁금해? 말은 공짜야.", "file": "audio/dokkaebi/NPC_DOKKAEBI_ASK_1.mp3", "sha256": "70201a5ec3c02ccdf10da6a51677e9e28f0720ffaf6179b5d9a20d30ea7a667a"}, {"id": "NPC_DOKKAEBI_HINT_AGAIN_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "글자 부적은 옷 홈에 박는 거야. 수복 먼저, 강녕 다음. 거꾸로 박으면 아무 일도 안 일어나.", "file": "audio/dokkaebi/NPC_DOKKAEBI_HINT_AGAIN_1.mp3", "sha256": "36ce152fa426a96c67c25f870ad04c0383ab8183c8defe14702695715fdff1c9"}, {"id": "NPC_DOKKAEBI_HINT_AGAIN_2", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "순서대로 박으면 뭐가 되는지는 안 가르쳐 주고?", "file": "audio/doho/NPC_DOKKAEBI_HINT_AGAIN_2.mp3", "sha256": "31b837e8fdf2113be58e5fef6a3471802153e54da7b84db04e084db8d3253d68"}, {"id": "NPC_DOKKAEBI_HINT_AGAIN_3", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "그건 박아 보면 알아. 틀려도 글자는 도로 빼 줄 수 있어. 장비는 내 몫이지만.", "file": "audio/dokkaebi/NPC_DOKKAEBI_HINT_AGAIN_3.mp3", "sha256": "d60bd467fabdaa1c69f6447485df667a7bf60867fe39395b87748c140ec3eb26"}, {"id": "NPC_DOKKAEBI_CHAT_MOKRO", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "나는 목로 쪽엔 안 가. 국물이 아무리 좋아도, 같은 장사끼리는 서로 모른 척하는 게 예의거든.", "file": "audio/dokkaebi/NPC_DOKKAEBI_CHAT_MOKRO.mp3", "sha256": "0ae37918f97f32d8807bccffea627beaaf9bfe9db388d93467af587402f3c796"}, {"id": "NPC_DOKKAEBI_CHAT_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "옥은 같은 걸 셋 모아 오면 한 단 위 옥으로 바꿔 줘. 글자 부적도 같은 글자 셋이면 다음 글자로 바꿔 주지.", "file": "audio/dokkaebi/NPC_DOKKAEBI_CHAT_1.mp3", "sha256": "47f18b85598e99f77abac780ecac5fb676e9e1baa0c201e5016f5627215f66a3"}, {"id": "NPC_DOKKAEBI_CHAT_2", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "박아 둔 걸 도로 빼고 싶으면 장비째로 맡겨. 알맹이는 돌려주고 껍데기는 내가 먹지.", "file": "audio/dokkaebi/NPC_DOKKAEBI_CHAT_2.mp3", "sha256": "eadf203e3c0b10a3b71d2a0d567788cad929de767059c98270de7de8da075753"}, {"id": "NPC_DOKKAEBI_CHAT_3", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "틀리게 맡겨도 물건은 도로 줘. 도깨비는 값 치른 것만 먹거든.", "file": "audio/dokkaebi/NPC_DOKKAEBI_CHAT_3.mp3", "sha256": "f4a658a401748a051ad6b0db8bdac1e412823557c78456bdb435c757a599cda0"}, {"id": "NPC_DOKKAEBI_CHAT_4", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "글자 부적은 순서가 반이야. 같은 글자도 순서가 틀리면 그냥 부적 종이일 뿐이지.", "file": "audio/dokkaebi/NPC_DOKKAEBI_CHAT_4.mp3", "sha256": "493fead8c4f4a0712f55f02341f54ea470b432f4207146928f92403247e1a940"}, {"id": "NPC_DOKKAEBI_CHAT_5", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "요괴 몸에서 떨어진 건 함부로 팔지 마. 장사꾼 눈엔 잡동사니라도 내 눈엔 아닐 때가 있거든.", "file": "audio/dokkaebi/NPC_DOKKAEBI_CHAT_5.mp3", "sha256": "5941acdab201e5c33c8a8953b8db20c47d56d82305a2f578dc35457d2c930152"}, {"id": "NPC_DOKKAEBI_CHAT_6", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "옛 도사들 곁에서 먹 갈던 몸이라 글귀를 좀 알지. 어깨너머로 배웠는데, 어깨가 높았거든.", "file": "audio/dokkaebi/NPC_DOKKAEBI_CHAT_6.mp3", "sha256": "586ab10c8609a2226fc3aeb6d0011b1425f31dc40c0a1b7613546e82e1c271aa"}, {"id": "NPC_DOKKAEBI_CHAT_7", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "무당 할매는 날 볼 때마다 눈을 가늘게 떠. 해코지 안 한다니까. 오래 산 것끼리 좀 봐줘도 될 텐데.", "file": "audio/dokkaebi/NPC_DOKKAEBI_CHAT_7.mp3", "sha256": "ffc6fd866d2887d568cb5e7dadea5bc1ec08aff054395d2760b010d9e9303ac3"}, {"id": "NPC_DOKKAEBI_CHAT_8", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "비결서 쪽이 주워지거든 버리지 말고 챙겨 둬. 옛 도사들 글씨는 쓸 데가 있는 법이야.", "file": "audio/dokkaebi/NPC_DOKKAEBI_CHAT_8.mp3", "sha256": "c2955bc5d73451a28c852a6c25d10e8b3c0ec24feaae4ba1a1ccc087fcd7abcf"}, {"id": "NPC_DOKKAEBI_MADE_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "자, 바꿔 줬어. 잘 봐, 속임수는 없어.", "file": "audio/dokkaebi/NPC_DOKKAEBI_MADE_1.mp3", "sha256": "34f8e0f239a2dfb4d6c98eec2bd8380d41f69e015279c76965edd52cafd5a939"}, {"id": "NPC_DOKKAEBI_MADE_2", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "됐네. 도깨비 솜씨는 믿을 만하지.", "file": "audio/dokkaebi/NPC_DOKKAEBI_MADE_2.mp3", "sha256": "d79be932fd94840558d12682e5ffc249134e31985062de645227e2b24dd597af"}, {"id": "NPC_DOKKAEBI_MADE_3", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "뚝딱은 아니고 좀 걸렸어. 받아 가.", "file": "audio/dokkaebi/NPC_DOKKAEBI_MADE_3.mp3", "sha256": "a72252faf4a11d4c9df88ab555f15f29e0f48286b7cc074ba90237740508804b"}, {"id": "NPC_DOKKAEBI_MADE_UNIQUE_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "이야, 손맛 나는 물건이 나왔네. 아무 데나 굴러다니는 물건이 아니야. 간수 잘해.", "file": "audio/dokkaebi/NPC_DOKKAEBI_MADE_UNIQUE_1.mp3", "sha256": "f9f0a64bbeba5a42afb1e1b9203213b117c2e9896e0dda9266823fca405ddc0a"}, {"id": "NPC_DOKKAEBI_MADE_UNIQUE_2", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "내 솜씨 중에서도 상등품이야. 팔아먹을 생각은 접어 둬.", "file": "audio/dokkaebi/NPC_DOKKAEBI_MADE_UNIQUE_2.mp3", "sha256": "b2221f1a3a9b9bd42391c159f6c4df1b1310ca8b73c2c49182a46245e994142a"}, {"id": "NPC_DOKKAEBI_MADE_UNIQUE_3", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "좋은 재료를 가져왔으니 좋은 물건이 나오지. 도깨비 눈은 틀리는 법이 없거든.", "file": "audio/dokkaebi/NPC_DOKKAEBI_MADE_UNIQUE_3.mp3", "sha256": "83adb83b10164237a8a392f5f226bd4992d9d8c18aeb3d34826a28563661da28"}, {"id": "NPC_DOKKAEBI_NOTHING_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "이걸론 아무것도 안 돼. 도로 가져가, 손해 본 건 없으니까.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NOTHING_1.mp3", "sha256": "b512f8ba3e10211adbf6a42af9853b0b58194d277cb8270109f5dfb394a37f7a"}, {"id": "NPC_DOKKAEBI_NOTHING_2", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "한 상에 올릴 물건들이 아니야. 도로 가져가.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NOTHING_2.mp3", "sha256": "adffd8d72102cb4c68b62f2e9ee3709b72428e2a383e36feabefe68563d1d6a4"}, {"id": "NPC_DOKKAEBI_NOTHING_3", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "재주를 부리라면서 재료가 이래? 도로 가져가. 안 뺏어.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NOTHING_3.mp3", "sha256": "74c6c9b558e974a7df306b6bc302e2d6595e4e3c84aaddd302ce3c292312e94a"}, {"id": "NPC_DOKKAEBI_NO_RESULT_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "이치는 맞는데 내줄 게 없어. 더 올릴 데도, 바꿔 줄 짝도 바닥이네.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NO_RESULT_1.mp3", "sha256": "a0f71ef6b1d2d3b098383ca6fc74f4455ef65dadaa0ef29469bb1e9111f6bc82"}, {"id": "NPC_DOKKAEBI_NO_RESULT_2", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "재주가 모자란 게 아니라 판이 바닥이야. 맡긴 건 도로 가져가.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NO_RESULT_2.mp3", "sha256": "4734e7ceefd9886c7fe6cb8c995859072ede4772ddb8522ca5e24f34b326935c"}, {"id": "NPC_DOKKAEBI_NO_RESULT_3", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "맞게 가져왔는데 만들 게 없다니, 서로 민망하게 됐네.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NO_RESULT_3.mp3", "sha256": "6a0b17aebc5e881f48a69f1a0819697a1d4046a277aac6a633815ed9c108f419"}, {"id": "NPC_DOKKAEBI_GOLD_SHORT_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "엽전이 모자라. 도깨비 장사도 공짜는 아니야. 채워서 와.", "file": "audio/dokkaebi/NPC_DOKKAEBI_GOLD_SHORT_1.mp3", "sha256": "db9bea3430fc05ba654503ba4887f3b10838d5956bb2abb304b49ca8a0b2c634"}, {"id": "NPC_DOKKAEBI_GOLD_SHORT_2", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "재료는 맞는데 값이 모자라. 나중에 주겠다는 말은 안 믿어.", "file": "audio/dokkaebi/NPC_DOKKAEBI_GOLD_SHORT_2.mp3", "sha256": "df17268a0e745a86f21171c22aa0bc35f37c5edd06e106056347406a62b5d25d"}, {"id": "NPC_DOKKAEBI_GOLD_SHORT_3", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "주머니가 가볍네. 값은 값이야. 채워서 다시 와.", "file": "audio/dokkaebi/NPC_DOKKAEBI_GOLD_SHORT_3.mp3", "sha256": "a3a5fd3d6410e6562d93c4dbc998e391b2a9320b606ad13b9fff79937eb40066"}, {"id": "NPC_DOKKAEBI_BAG_FULL_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "받아 갈 자리가 없잖아. 가방부터 비워 와.", "file": "audio/dokkaebi/NPC_DOKKAEBI_BAG_FULL_1.mp3", "sha256": "dd47c388c073f6868e9319f9fae209c7af09027b5f7af887f17b8bf041d112cd"}, {"id": "NPC_DOKKAEBI_BAG_FULL_2", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "바꿔 주는 것도 좋지만 받아 갈 손은 비워 둬야지. 가방 좀 정리해.", "file": "audio/dokkaebi/NPC_DOKKAEBI_BAG_FULL_2.mp3", "sha256": "238a1914e8fd0ac4cab3017f452f544ff5338f7352fbf9e99ec98a7804e7ac05"}, {"id": "NPC_DOKKAEBI_BAG_FULL_3", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "내줄 물건 놓을 데가 없어. 가방 비우고 다시 와.", "file": "audio/dokkaebi/NPC_DOKKAEBI_BAG_FULL_3.mp3", "sha256": "be7656aa631c28fe8570fc07909c690f133876f2ba1a53d9197cafa651cb1f76"}, {"id": "NPC_DOKKAEBI_EMPTY_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "빈손으로 뭘 바꾸라는 거야. 올려 놓고 말해.", "file": "audio/dokkaebi/NPC_DOKKAEBI_EMPTY_1.mp3", "sha256": "1ba7d5530d002c78e91bd4469554b6e309ce919beeaa603b966bff81bb53ef76"}, {"id": "NPC_DOKKAEBI_EMPTY_2", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "칸이 텅 비었잖아. 도깨비도 없는 걸론 못 바꿔 줘.", "file": "audio/dokkaebi/NPC_DOKKAEBI_EMPTY_2.mp3", "sha256": "517055cb28469271dad4a879cad2f0b2c937692e5e4a1d35c9156b0c8dc1a9f0"}, {"id": "NPC_DOKKAEBI_SWAP_DONE_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "옜다, 누비옷. 홈 둘이야. 수복 먼저, 강녕 다음, 잊지 마.", "file": "audio/dokkaebi/NPC_DOKKAEBI_SWAP_DONE_1.mp3", "sha256": "cd5135c30967311a374f3dd2821041271518afa1d0833030866fc0b907b7ede6"}, {"id": "NPC_DOKKAEBI_SWAP_DONE_2", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "거래 성사. 옷은 잘 입고, 준 장비는 내가 잘 쓸게.", "file": "audio/dokkaebi/NPC_DOKKAEBI_SWAP_DONE_2.mp3", "sha256": "700695c399d73ceb4ada003516497584e9305f8ae06c1162496b234a4cb17c33"}, {"id": "NPC_DOKKAEBI_SWAP_NONE_1", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "빈손이네. 쓰던 장비 하나 들고 다시 와. 누비옷은 어디 안 가.", "file": "audio/dokkaebi/NPC_DOKKAEBI_SWAP_NONE_1.mp3", "sha256": "313f1aaa58cd7eda53b6b504c3098a8ba4fea22403853f82998bbae052b25fa2"}, {"id": "NPC_DOKKAEBI_SWAP_NONE_2", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "마음이 안 내키나 보네. 하고 싶을 때 와. 누비옷은 안 도망가.", "file": "audio/dokkaebi/NPC_DOKKAEBI_SWAP_NONE_2.mp3", "sha256": "121613437c62fe175abb8c4813c655957448da3270000b70ca42fec19df190bc"}, {"id": "NPC_DOKKAEBI_NEAR_G05_ELSE", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "거의 다 왔는데 어딘가 하나가 어긋났어. 다시 살펴봐.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NEAR_G05_ELSE.mp3", "sha256": "04620092ad65b9d77d3439333c84ec4e366a9fc2ed79840c40eda36a574d165b"}, {"id": "NPC_DOKKAEBI_NEAR_G06_RULE", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "옥 셋이 한 빛깔이네. 한 가족끼리만 모이면 안 돼. 빛깔이 서로 달라야 해.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NEAR_G06_RULE.mp3", "sha256": "50ff072d4f9e92c1f5b76f2232f460df5171ca356c3d4af191434d9625355f88"}, {"id": "NPC_DOKKAEBI_NEAR_G06_ELSE", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "거의 다 왔는데 어딘가 하나가 어긋났어. 다시 살펴봐.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NEAR_G06_ELSE.mp3", "sha256": "66c5cf4dc511ae6d89e4df8d1f3bafc887187a33672b920f382bf2ea276e2dcf"}, {"id": "NPC_DOKKAEBI_NEAR_G07_ELSE", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "거의 다 왔는데 어딘가 하나가 어긋났어. 다시 살펴봐.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NEAR_G07_ELSE.mp3", "sha256": "28f514725692fd3e5943b3bb0db2d66fb03624cfb808c6b8014f3ec241d89fc7"}, {"id": "NPC_DOKKAEBI_NEAR_G08_ELSE", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "거의 다 왔는데 어딘가 하나가 어긋났어. 다시 살펴봐.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NEAR_G08_ELSE.mp3", "sha256": "869a69eef2061fe59413ea00ad70206fd67308e6104ace7fcc299d46ced74443"}, {"id": "NPC_DOKKAEBI_NEAR_G09_RULE", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "옥이 한 빛깔이야. 다듬으려면 빛깔이 서로 달라야 해.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NEAR_G09_RULE.mp3", "sha256": "7b3171b43b13ed401a2f1c6e15b4f1af2b508c64c67b7e46a2e6d3f21041c647"}, {"id": "NPC_DOKKAEBI_NEAR_G09_ELSE", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "거의 다 왔는데 어딘가 하나가 어긋났어. 다시 살펴봐.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NEAR_G09_ELSE.mp3", "sha256": "b9a12971763477212b262bf9d99b0c78c35a45901aad8c8016fa22380d89e2d0"}, {"id": "NPC_DOKKAEBI_NEAR_G10_RULE", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "조각 둘이 서로 다른 벌이야. 같은 벌끼리 가져와야 바꿔 줘.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NEAR_G10_RULE.mp3", "sha256": "e2074ddb3634eab1fecc1a5b81a1240ddb25e3168e9b6cedea0d303cc4026143"}, {"id": "NPC_DOKKAEBI_NEAR_G10_ELSE", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "거의 다 왔는데 어딘가 하나가 어긋났어. 다시 살펴봐.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NEAR_G10_ELSE.mp3", "sha256": "780996878968d5d9898565559393d668b8aa1b30de33de13ea6fe276ea0553e4"}, {"id": "NPC_DOKKAEBI_NEAR_G11_ELSE", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "거의 다 왔는데 어딘가 하나가 어긋났어. 다시 살펴봐.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NEAR_G11_ELSE.mp3", "sha256": "7a201287af38f64846a380995653e33647dd5772a5d0ca67857e98b1d583f575"}, {"id": "NPC_DOKKAEBI_NEAR_G12_ELSE", "speaker": "dokkaebi", "role": "도깨비 · 거한 C", "text": "거의 다 왔는데 어딘가 하나가 어긋났어. 다시 살펴봐.", "file": "audio/dokkaebi/NPC_DOKKAEBI_NEAR_G12_ELSE.mp3", "sha256": "d1f42055b2cc319599c2ad493e9a55dec72b6d0b0e146f53b4f06f1b9b4d6bce"}, {"id": "NPC_ELDER_FIRST_1", "speaker": "elder", "role": "촌장 · 노년 B", "text": "떠돌이 도사가 웬일이오.", "file": "audio/elder/NPC_ELDER_FIRST_1.mp3", "sha256": "e75d7062f00f59357edcfcecd3d19dd84e0ad54df93e15eb92d8f2db88bc5778"}, {"id": "NPC_ELDER_FIRST_2", "speaker": "elder", "role": "촌장 · 노년 B", "text": "못골 장터가 닫힌 지 석 달이오.", "file": "audio/elder/NPC_ELDER_FIRST_2.mp3", "sha256": "90e06de09df13e148e6142f7dd551de62ffc5677d2fca14a1196c2b8c3a4d8d5"}, {"id": "NPC_ELDER_AFTER_1", "speaker": "elder", "role": "촌장 · 노년 B", "text": "베었구려! 못골이 오랜만에 숨을 쉬겠소.", "file": "audio/elder/NPC_ELDER_AFTER_1.mp3", "sha256": "270ac801d7f599eb6a0e2d4d907369b4f7dd53dafd5193ad155cf10b5c4fadd6"}, {"id": "NPC_ELDER_THANKS_NUDGE", "speaker": "elder", "role": "촌장 · 노년 B", "text": "사례는 받아 가시오. 빈손으로 보내면 내 잠자리가 편치 않소.", "file": "audio/elder/NPC_ELDER_THANKS_NUDGE.mp3", "sha256": "06a9b0fb47e0ba9ab472501763c80670e0b7968eac74c10fc66ac8cf4ace10cd"}, {"id": "NPC_ELDER_CLEAR_DONE_1", "speaker": "elder", "role": "촌장 · 노년 B", "text": "간밤엔 굴 쪽이 조용했소. …도사 양반 솜씨요?", "file": "audio/elder/NPC_ELDER_CLEAR_DONE_1.mp3", "sha256": "731a5a5b3b33c09a3b1704a51d9214ffe49adf96c7d6971e944882d967c991c8"}, {"id": "NPC_ELDER_CLEAR_DONE_2", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "산책 좀 했지.", "file": "audio/doho/NPC_ELDER_CLEAR_DONE_2.mp3", "sha256": "a6a2eaddc639424430b08dffe22f7d50473f04ba6bea26baddfe7b9b147f068b"}, {"id": "NPC_ELDER_CLEAR_ACTIVE_1", "speaker": "elder", "role": "촌장 · 노년 B", "text": "간밤에도 굴 어귀에서 뭔가 울었소. 아직 남았구려.", "file": "audio/elder/NPC_ELDER_CLEAR_ACTIVE_1.mp3", "sha256": "5d989acc71a01ebab4a52e0cb4760f9d380d5b1e8d9fe65c65f9158f3a2f3635"}, {"id": "NPC_ELDER_CLEAR_ACTIVE_2", "speaker": "elder", "role": "촌장 · 노년 B", "text": "어귀만 비우면 되오. 끝까지 가란 말이 아니오.", "file": "audio/elder/NPC_ELDER_CLEAR_ACTIVE_2.mp3", "sha256": "530a702420c69ab0f0e1e8745332963d26d2c5c984d9a46035bd8186bd5635ef"}, {"id": "NPC_ELDER_OFFER_AGAIN", "speaker": "elder", "role": "촌장 · 노년 B", "text": "굴 어귀 일, 생각해 보셨소?", "file": "audio/elder/NPC_ELDER_OFFER_AGAIN.mp3", "sha256": "4952ab83227230faf112aa34d36cb4a95f8a8feaa92198512e497404ffe17a9f"}, {"id": "NPC_ELDER_ACTIVE_1", "speaker": "elder", "role": "촌장 · 노년 B", "text": "무당 할매 말씀은 믿어도 되오. 그분이 틀린 적은 없소.", "file": "audio/elder/NPC_ELDER_ACTIVE_1.mp3", "sha256": "47ef966cc6b1f88e736907d8537d82b32aa11293a84ea85ce65787a1b00e2656"}, {"id": "NPC_ELDER_ACTIVE_2", "speaker": "elder", "role": "촌장 · 노년 B", "text": "굴 끝까지 가신다니… 부디 무리하지 마시오.", "file": "audio/elder/NPC_ELDER_ACTIVE_2.mp3", "sha256": "c5dd6c5d45ed276f000462f0dc4ff7058a02924a9e602dd6e2f1e13ff4738549"}, {"id": "NPC_ELDER_OFFER_1", "speaker": "elder", "role": "촌장 · 노년 B", "text": "부탁이 하나 있소. 흑랑 굴 말이오.", "file": "audio/elder/NPC_ELDER_OFFER_1.mp3", "sha256": "dd982b3486586bd51df2d57482f34c719094cc82c3f835ffd69d317f62edb590"}, {"id": "NPC_ELDER_OFFER_2", "speaker": "elder", "role": "촌장 · 노년 B", "text": "밤마다 어귀에서 것들이 기어 나와 밭을 헤집고 외양간을 비우오.", "file": "audio/elder/NPC_ELDER_OFFER_2.mp3", "sha256": "53e456aca98e21e6775638908d8d5baff8b1b48d6bf68427cd231ef1365dee6e"}, {"id": "NPC_ELDER_OFFER_3", "speaker": "elder", "role": "촌장 · 노년 B", "text": "끝까지는 바라지도 않소. 첫 층만… 비워 주시오.", "file": "audio/elder/NPC_ELDER_OFFER_3.mp3", "sha256": "9dfb67e4ecd628910dff99192a9702bc8fdd24cc4b54ac104c8dec833e15b2d9"}, {"id": "NPC_ELDER_OFFER_4", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "첫 층만? 그럼 산책이구먼.", "file": "audio/doho/NPC_ELDER_OFFER_4.mp3", "sha256": "48784e5a3de7a746ef09b50c32773cc3f717588a2e14fb7c94a354f7c80084d2"}, {"id": "NPC_ELDER_GREET_1", "speaker": "elder", "role": "촌장 · 노년 B", "text": "떠돌이 도사가 웬일이오.", "file": "audio/elder/NPC_ELDER_GREET_1.mp3", "sha256": "73356ba13e7a18a50c453312e76364315aa64df1ef97214f298b258cd475c6d9"}, {"id": "NPC_ELDER_GREET_2", "speaker": "elder", "role": "촌장 · 노년 B", "text": "못골 장터가 닫힌 지 석 달이오.", "file": "audio/elder/NPC_ELDER_GREET_2.mp3", "sha256": "4c7d74125981e563f428ef0633bc16f326c9f11f41d905ef2e929a16f060e779"}, {"id": "NPC_ELDER_GREET_3", "speaker": "elder", "role": "촌장 · 노년 B", "text": "요괴병에 장정 셋을 잃었소.", "file": "audio/elder/NPC_ELDER_GREET_3.mp3", "sha256": "ee786cd7ad242bff281cd99e00b5e35a0c76112778242499e4de7e8d5889c08b"}, {"id": "NPC_ELDER_GREET_4", "speaker": "elder", "role": "촌장 · 노년 B", "text": "젊은이들은 떠났고, 남은 건 걱정뿐이오.", "file": "audio/elder/NPC_ELDER_GREET_4.mp3", "sha256": "1c240049a27b6f2b2eb7e93d84a1f451131ec7cab7754eda81a494afb4655dd9"}, {"id": "NPC_ELDER_ACCEPT_1", "speaker": "elder", "role": "촌장 · 노년 B", "text": "그 산책, 부디 무사히 끝내시오.", "file": "audio/elder/NPC_ELDER_ACCEPT_1.mp3", "sha256": "4f63218a370da8e62bcd61ded5606dea04a4fe8268976fa4a34f6db72da1a700"}, {"id": "NPC_ELDER_REPORT_1", "speaker": "elder", "role": "촌장 · 노년 B", "text": "몇 해 전 묵어 간 도사가 두고 간 책이 한 권 있소. 우리 집안은 까막눈이라…", "file": "audio/elder/NPC_ELDER_REPORT_1.mp3", "sha256": "a6c948ee31cc84bc5048b2760f3058c1f4afc22ac5a2242181b051694d2374cd"}, {"id": "NPC_ELDER_REPORT_2", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "글은 내가 좀 읽지.", "file": "audio/doho/NPC_ELDER_REPORT_2.mp3", "sha256": "f953952bf210c2c90248b5a5cbf8e3909df450c7f1a3af80efc84c23882942ae"}, {"id": "NPC_ELDER_REPORT_3", "speaker": "elder", "role": "촌장 · 노년 B", "text": "가져가시오. 굴 어귀 값이오.", "file": "audio/elder/NPC_ELDER_REPORT_3.mp3", "sha256": "32ba954b888d711eabf2c2eda9cba037f7593e4c878c6470c7a3532c643223c2"}, {"id": "NPC_ELDER_THANKS_1", "speaker": "elder", "role": "촌장 · 노년 B", "text": "약소하지만… 받으시오.", "file": "audio/elder/NPC_ELDER_THANKS_1.mp3", "sha256": "c09c1b7efd62e814ef8c4236e8e4d2ac5e5b787ba4c7eb35258595adcfbb6d4f"}, {"id": "NPC_ELDER_AFTER_2", "speaker": "elder", "role": "촌장 · 노년 B", "text": "고맙소. …구미호는 아직 북쪽 산길 끝, 봉밀굴 문 너머에 있소. 잊지 마시오.", "file": "audio/elder/NPC_ELDER_AFTER_2.mp3", "sha256": "57895b458ca52c93196873ef4ba733697b807039d2310d7d55dead4951e1aee4"}, {"id": "NPC_ELDER_THANKS_FULL", "speaker": "elder", "role": "촌장 · 노년 B", "text": "짐이 많구려. 가방을 비우고 다시 오시오.", "file": "audio/elder/NPC_ELDER_THANKS_FULL.mp3", "sha256": "fb67e0606135aa380564b7c0b9a3396e531d855ce3b3f9f46c73433c733434b3"}, {"id": "NPC_ELDER_VOUCH_1", "speaker": "elder", "role": "촌장 · 노년 B", "text": "주모 만나셨소? 그 사람은 이 장터를 혼자 지켰소. 손님 없는 날도 솥은 안 내렸지.", "file": "audio/elder/NPC_ELDER_VOUCH_1.mp3", "sha256": "d2fc1977d7b49400af9a6ec46bfe4a770bda14119c88eb53398946e18c567fbc"}, {"id": "NPC_ELDER_HINT_G06_1", "speaker": "elder", "role": "촌장 · 노년 B", "text": "내가 뚫어 드린 건 이번 한 번뿐이오. 늙은이 솜씨에도 한도가 있소.", "file": "audio/elder/NPC_ELDER_HINT_G06_1.mp3", "sha256": "4e9b228b2413f04d2aa52255cdf46bc470a7a7818cac83d7e99268d4dd8df98e"}, {"id": "NPC_ELDER_HINT_G06_2", "speaker": "elder", "role": "촌장 · 노년 B", "text": "더 뚫고 싶거든 장터 뒤 도깨비를 찾아가 보시오. 빛깔 다른 온전한 옥 셋과 엽전이면 뚫어 준다 하오.", "file": "audio/elder/NPC_ELDER_HINT_G06_2.mp3", "sha256": "5fe8507c6097c66741dde7323e27ece0c7c4f2dc3961b88bde22245ec8b5fdad"}, {"id": "NPC_ELDER_HINT_G06_3", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "촌장 솜씨보다 도깨비 솜씨가 낫다는 얘기구먼.", "file": "audio/doho/NPC_ELDER_HINT_G06_3.mp3", "sha256": "6760f12d7433774b322bd777b2fd88bafb64e818f4ae7ca870261837b3cf0558"}, {"id": "NPC_JUMO_FIRST_1", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "도사 양반, 목이나 축이고 가시구려. 술은… 없어도 국물은 있지.", "file": "audio/jumo/NPC_JUMO_FIRST_1.mp3", "sha256": "a55f3529c08d2fd29e7927c45be580a779622e467b33abdaf127dada40a27ce1"}, {"id": "NPC_JUMO_FIRST_2", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "국물이면 됐지. 외상도 되나?", "file": "audio/doho/NPC_JUMO_FIRST_2.mp3", "sha256": "843d0b31d18d6b230f661640910d326a8b25e285cade642bb69d87917873c057"}, {"id": "NPC_JUMO_FIRST_3", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "외상은 살아서 돌아오는 사람한테만 놓수.", "file": "audio/jumo/NPC_JUMO_FIRST_3.mp3", "sha256": "7365ccc5c6e81baf0c209e4b10b6371518ba4ba383691d67aa0def2a68752251"}, {"id": "NPC_JUMO_MAIN_1", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "그나저나 도사 양반, 이 장터가 왜 닫혔는지는 아시우?", "file": "audio/jumo/NPC_JUMO_MAIN_1.mp3", "sha256": "cc626b5725fcc9609c04538fef38f698514c68ac897a020b3036d4ab8ce5bbd3"}, {"id": "NPC_JUMO_MAIN_2", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "봉인이 무너져서 괴질이 돈다는 건 대충 들었지.", "file": "audio/doho/NPC_JUMO_MAIN_2.mp3", "sha256": "f81f3a76a38e511edd84b0e9a0b27c091095b80e843b173b22e663e503436576"}, {"id": "NPC_JUMO_MAIN_3", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "마을 북쪽 산길 끝에 봉밀굴 문 있잖우. 돌문 말이우.", "file": "audio/jumo/NPC_JUMO_MAIN_3.mp3", "sha256": "b496af5cff1c642de257aa6cdff4ea850792b26e0cc358b324ef68de878b40ec"}, {"id": "NPC_JUMO_MAIN_3B", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "그 문 열쇠가 세 조각으로 쪼개져서, 굴마다 하나씩 박혀 있다우.", "file": "audio/jumo/NPC_JUMO_MAIN_3B.mp3", "sha256": "a95b54a95dd96ad2d6d214ec9da87ffe0ee5266206560181083675121d318f78"}, {"id": "NPC_JUMO_MAIN_3C", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "개가 하나, 들녘 흑랑 굴이우. 범이 하나, 고개 너머 범굴이우.", "file": "audio/jumo/NPC_JUMO_MAIN_3C.mp3", "sha256": "de055f90edaacf8a23f97dfce706d01607532dceb9c9e0cfe180e321e52dc121"}, {"id": "NPC_JUMO_MAIN_4", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "소문치곤 번지수까지 친절하구먼.", "file": "audio/doho/NPC_JUMO_MAIN_4.mp3", "sha256": "9eb8e6e3bc38f0d63dcad7c0f08acf6313abd547719601e835e95bd021c2d6c4"}, {"id": "NPC_JUMO_MAIN_4B", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "쇠 먹는 놈 뱃속에 하나는, 같은 고개 너머 쇠부리 폐광이우.", "file": "audio/jumo/NPC_JUMO_MAIN_4B.mp3", "sha256": "1cad3ea23459e4ddeabcb2c4c35f4ff2c025999a4f8eb282538a7f50ec2bb692"}, {"id": "NPC_JUMO_MAIN_5", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "목로에 앉아 있으면 소문이 다 들어오우. 값은 국물에 쳐서 받지.", "file": "audio/jumo/NPC_JUMO_MAIN_5.mp3", "sha256": "485315c5711328ce3e214acfb169afdeeac31d337a1c8aa9d2cc6af62f72e3c0"}, {"id": "NPC_JUMO_MAIN_6", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "열쇠를 모아 문을 열어야 이 병의 뿌리를 뽑을 수 있고, 뿌리를 뽑아야 닫힌 장터가 다시 열리지.", "file": "audio/jumo/NPC_JUMO_MAIN_6.mp3", "sha256": "38ec9ef9c7b37343d844046694a8d666687b74f4abdd38dcb147801b202e776b"}, {"id": "NPC_JUMO_MAIN_7", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "뿌리라… 구미호 말이지.", "file": "audio/doho/NPC_JUMO_MAIN_7.mp3", "sha256": "150db73121e33da8b1b37a71f60b54c899aa5866dcb21b057ac8de0d3877c0a8"}, {"id": "NPC_JUMO_MAIN_8", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "…그 이름은 내 입에 올리기 싫수. 국물 식겠수.", "file": "audio/jumo/NPC_JUMO_MAIN_8.mp3", "sha256": "e1a7f9835050010c4247e81454f34f68370c21d21193b439da18067c88e6d602"}, {"id": "NPC_JUMO_MAIN_9", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "국물값치곤 일이 크네. 외상으로 달아 두시오.", "file": "audio/doho/NPC_JUMO_MAIN_9.mp3", "sha256": "782606b175f783cc5440b2739672c611dfee78f3b3666466b8de19e2f30f1c3e"}, {"id": "NPC_JUMO_MAIN_10", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "가까운 데부터 가시구려. 동쪽 문 밖 들녘에 흑랑 굴이 있수. …국물은 식어도 외상은 안 식수.", "file": "audio/jumo/NPC_JUMO_MAIN_10.mp3", "sha256": "4a94f8e32764f24714719b8feb7848d86cbd785c0b905c44362c39922a719cfd"}, {"id": "NPC_JUMO_GAKSI_DONE_1", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "…끝났소?", "file": "audio/jumo/NPC_JUMO_GAKSI_DONE_1.mp3", "sha256": "7ad5395973c7f3f119f502b6c9a99098d44a1635a49f739be8e56a9188497a6a"}, {"id": "NPC_JUMO_GAKSI_DONE_2", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "잘했소, 도사 양반. 그 집 얘기는 이제, 그만합시다.", "file": "audio/jumo/NPC_JUMO_GAKSI_DONE_2.mp3", "sha256": "a3d53a0d99fb8e3deed76e3aeb8f4aa39981837a2e05d71745977d745ec0c074"}, {"id": "NPC_JUMO_NEWS2_1", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "둘이나 모으셨수? 도사 양반, 생각보다 훨씬 믿음직하구먼.", "file": "audio/jumo/NPC_JUMO_NEWS2_1.mp3", "sha256": "2b86e49edd99ad2c511a4b8a58a910da836ac2cd39c92d087c43d6c2c009d525"}, {"id": "NPC_JUMO_NEWS2_LAST_HEUK", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "이제 들녘 흑랑 굴 하나 남았수. 다 모으거든 북쪽 돌문에 대 보시우.", "file": "audio/jumo/NPC_JUMO_NEWS2_LAST_HEUK.mp3", "sha256": "859ac54a3c6508c6f0f444227a21bb8c2368404fa7e4f6bc8780fb3b75b919cd"}, {"id": "NPC_JUMO_NEWS2_LAST_BEOM", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "이제 정령재 범굴 하나 남았수. 다 모으거든 북쪽 돌문에 대 보시우.", "file": "audio/jumo/NPC_JUMO_NEWS2_LAST_BEOM.mp3", "sha256": "12d0750aa6a994d6156906c2b8852b5392cff92a490abd2d3f06b7805cdcfb17"}, {"id": "NPC_JUMO_NEWS2_LAST_SOE", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "이제 정령재 쇠부리 폐광 하나 남았수. 다 모으거든 북쪽 돌문에 대 보시우.", "file": "audio/jumo/NPC_JUMO_NEWS2_LAST_SOE.mp3", "sha256": "40ac2b934c735233187392eb328c92a11a272bd8dcb79a34976044268797fe45"}, {"id": "NPC_JUMO_NEWS2_3", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "그때까지 내가 이 목로를 지키고 있을지는 모르겠수만.", "file": "audio/jumo/NPC_JUMO_NEWS2_3.mp3", "sha256": "35d47f7a1b5d5e5d4282906603369213396d6b76912b87a05c2013cd3408903f"}, {"id": "NPC_JUMO_NEWS2_4", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "장사 접을 일이라도 있수?", "file": "audio/doho/NPC_JUMO_NEWS2_4.mp3", "sha256": "dba70308803855e2f29cbe0c27d57989926c331000129e52513ac541cdd9b321"}, {"id": "NPC_JUMO_NEWS2_5", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "사람 일은 모르는 거우.", "file": "audio/jumo/NPC_JUMO_NEWS2_5.mp3", "sha256": "7532dfee57e2b409893aac5d9a3ccbb67c9cf4e158f2824f5d0fbf78d947e8db"}, {"id": "NPC_JUMO_NEWS1_1", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "벌써 하나 가져오셨수? 그게 열쇠우? 어디 좀…", "file": "audio/jumo/NPC_JUMO_NEWS1_1.mp3", "sha256": "381e178bde8f207516c12e75e1ab487eaec1b4ca4e5d05e920a2d22189ad62e1"}, {"id": "NPC_JUMO_NEWS1_3", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "에구, 나이 드니 손이 시려서. 도사 양반이 들고 계시우.", "file": "audio/jumo/NPC_JUMO_NEWS1_3.mp3", "sha256": "e588795347f2a8ed310d8a8f8d61fc713f96de4fc4d80ab04f136179cc363a46"}, {"id": "NPC_JUMO_NEWS1_4", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "국물 한 그릇이면 들고 다니지.", "file": "audio/doho/NPC_JUMO_NEWS1_4.mp3", "sha256": "8eec8ac07121f753908b4314cc36a4ab29e3552d57c1e3a5d6549e1a1e275e50"}, {"id": "NPC_JUMO_NEWS1_HEUK", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "그 개는… 편히 갔수? …아니우, 괜한 소릴.", "file": "audio/jumo/NPC_JUMO_NEWS1_HEUK.mp3", "sha256": "bf2ff7ca47bcc04c8ef04fe191ef4cbe020623dd2918180c8e82ecf1cbcf2e76"}, {"id": "NPC_JUMO_NEWS1_LEFT_BEOM_SOE", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "남은 둘은 고개 너머 정령재에 있수. 범굴이랑 쇠부리 폐광이우. 어느 쪽이 먼저든 상관없지.", "file": "audio/jumo/NPC_JUMO_NEWS1_LEFT_BEOM_SOE.mp3", "sha256": "779a01aa627ea70d487a009bbb02f813df36e6674a21f5356d5ea6c086cddc36"}, {"id": "NPC_JUMO_NEWS1_LEFT_HEUK_SOE", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "남은 둘은 들녘 흑랑 굴이랑, 고개 너머 정령재 쇠부리 폐광이우. 어느 쪽이 먼저든 상관없지.", "file": "audio/jumo/NPC_JUMO_NEWS1_LEFT_HEUK_SOE.mp3", "sha256": "8a39b5c1943bb5c2f59ae30c928200b802ab3264d0cd4ff4c62a89d14d583a18"}, {"id": "NPC_JUMO_NEWS1_LEFT_HEUK_BEOM", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "남은 둘은 들녘 흑랑 굴이랑, 고개 너머 정령재 범굴이우. 어느 쪽이 먼저든 상관없지.", "file": "audio/jumo/NPC_JUMO_NEWS1_LEFT_HEUK_BEOM.mp3", "sha256": "2db9ea53685214fd1d8031d028ac1fd46f80848b041bd8d67fb3e4b3c0367354"}, {"id": "NPC_JUMO_NEWS1_END", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "외상이 자꾸 느는구먼. 갚을 날이 오긴 하려나.", "file": "audio/doho/NPC_JUMO_NEWS1_END.mp3", "sha256": "eed1404bdbb813cc98c7a53ba039ba936dfc41ecf8c5ff26d548e6ffcd31f6a7"}, {"id": "NPC_JUMO_GREET_1", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "어서 오시구려. 국물은 식기 전에 드시우.", "file": "audio/jumo/NPC_JUMO_GREET_1.mp3", "sha256": "c0b43fbf2832e8b1a2ed1a2d16ca4048db61405f8465a9d1c7514116aa9929dd"}, {"id": "NPC_JUMO_GREET_2", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "또 오셨수? 산 사람 얼굴 보니 반갑구먼.", "file": "audio/jumo/NPC_JUMO_GREET_2.mp3", "sha256": "36df33ed9efc68f19f69dcd0a1ceda6be502f9ac9b0fa67568ef631afed60373"}, {"id": "NPC_JUMO_GREET_3", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "도사 양반, 목이나 축이고 가시구려.", "file": "audio/jumo/NPC_JUMO_GREET_3.mp3", "sha256": "a50df9759193921e9f08da15deb667b1ccbcfbf0bf59fbf4aa3d1b9811869a8d"}, {"id": "NPC_JUMO_BUSY_1", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "요샌 내가 자리를 자주 비우우. 장 볼 데가 멀어서.", "file": "audio/jumo/NPC_JUMO_BUSY_1.mp3", "sha256": "0bc530ecd95d1f066f39b020074087033c325a31ccc5d5f3340c2e8e90a97113"}, {"id": "NPC_JUMO_BUSY_2", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "어딜 그리 다니냐고? …아낙 바쁜 데가 어디 한둘이우.", "file": "audio/jumo/NPC_JUMO_BUSY_2.mp3", "sha256": "49b5d993b90607c4f9a046739c1f0b43aa5f8d3db79f30f6bc107e7adfa66217"}, {"id": "NPC_JUMO_RUMOR_1", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "들녘 쪽엔 함부로 가지 마시오. 옛 주막 터에 뭔가 있다는 게 나만 하는 말이 아니오.", "file": "audio/jumo/NPC_JUMO_RUMOR_1.mp3", "sha256": "5a3f2c2ee03f84b18218e5badf794e765f6ad1b66e3dd061adfc8c447f1ad2b5"}, {"id": "NPC_JUMO_RUMOR_2", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "흑랑 굴 개들은 떼로 다니우. 한 놈 보이면 열 놈이라 치시구려.", "file": "audio/jumo/NPC_JUMO_RUMOR_2.mp3", "sha256": "10e361c2040298e6239bc0389a9f16d339d14ba2da1a1f455e1e70951fe714c6"}, {"id": "NPC_JUMO_RUMOR_3", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "고개 너머 쇠부리 폐광 사람들, 다 어디 갔는지… 밤마다 망치 소리만 난다우.", "file": "audio/jumo/NPC_JUMO_RUMOR_3.mp3", "sha256": "a246ddd7d6ad9468a052cb1e1b48bbfd227f68547c73f6478430777896ddb101"}, {"id": "NPC_JUMO_RUMOR_4", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "요새 밤이면 북쪽 산길 끝에서 여우 우는 소리가 들려. …여우는 무슨. 바람이겠지.", "file": "audio/jumo/NPC_JUMO_RUMOR_4.mp3", "sha256": "d0abace62c3586d4fe406fe5284d4b6b371807ef5ce5270e13840a937f33e0b5"}, {"id": "NPC_JUMO_RUMOR_5", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "내가 들녘 옛 주막집서… 오래 일했지. 그 얘긴, 말은 못 하겠소.", "file": "audio/jumo/NPC_JUMO_RUMOR_5.mp3", "sha256": "12114c8459b46b0eccb0c13fecb4e4dd9407e6220b6d1e840f1e36e2f481e1cc"}, {"id": "NPC_JUMO_RUMOR_6", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "흑랑 굴 맨 끝엔 불개 한 마리가 산다우. 달려들 땐 비켜서시구려.", "file": "audio/jumo/NPC_JUMO_RUMOR_6.mp3", "sha256": "66c547b4d47b8fe32b3da3a0387d365760fb0d1a8de63639d8ef1aef9e8a7223"}, {"id": "NPC_JUMO_RUMOR_7", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "범굴에선 누가 이름을 불러도 대답 마시우.", "file": "audio/jumo/NPC_JUMO_RUMOR_7.mp3", "sha256": "7ae853c88300e2089570c010ffdc7691df2cac70270f6664302d8b22a54c96d4"}, {"id": "NPC_JUMO_RUMOR_8", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "쇠부리 폐광엔 쇠 먹는 놈이 산다우. 칼이 안 들거든 불을 쓰시구려.", "file": "audio/jumo/NPC_JUMO_RUMOR_8.mp3", "sha256": "493b434da1c970f51aa24d2910497c93e411f3ebe4d3fa6fa180c5e270b8d8cf"}, {"id": "NPC_JUMO_OFFER_1", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "들녘 옛 주막 터 말이우. 밤이면 거기서 각시 하나가 운다오.", "file": "audio/jumo/NPC_JUMO_OFFER_1.mp3", "sha256": "c7154fad0da3ee82b975b14057d983f373f8d65e9a72f391023dc1d4e4f7c237"}, {"id": "NPC_JUMO_OFFER_2", "speaker": "jumo", "role": "주모 / 구미호 · 농밀 B", "text": "…각시 울음이나 그치게 해 주시오. 베든 달래든. 그 집 얘긴 그것만 하면 됐수.", "file": "audio/jumo/NPC_JUMO_OFFER_2.mp3", "sha256": "d26dbf837607420f7435331e08ddcd1cf5cc7fa0e461d7d6580701d1437062a8"}, {"id": "NPC_JUMO_OFFER_3", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "우는 사람 달래는 거라면 내가 좀 하지.", "file": "audio/doho/NPC_JUMO_OFFER_3.mp3", "sha256": "747e7e685ac5f28fc0bfdd55a604c822173e4734aad8d414b15939a357fcbe22"}, {"id": "NPC_MERCHANT_FIRST_1", "speaker": "merchant", "role": "김 영감 · 노장 C", "text": "어이구, 도사 양반. 이 난리 통에 장사가 되겠수?", "file": "audio/merchant/NPC_MERCHANT_FIRST_1.mp3", "sha256": "69f2f562d3e09435c4e542c64c2380ceb208149e9b75b3f3ac3d67d9e8fff681"}, {"id": "NPC_MERCHANT_FIRST_2", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "되게 해 드리지. 대신 값은 좀 깎고.", "file": "audio/doho/NPC_MERCHANT_FIRST_2.mp3", "sha256": "abecd8846c2c08ec020e7333bbe5a8e4199e1586bac7ef93061b0a16b1699f2b"}, {"id": "NPC_MERCHANT_FIRST_3", "speaker": "merchant", "role": "김 영감 · 노장 C", "text": "허허, 벌써부터?", "file": "audio/merchant/NPC_MERCHANT_FIRST_3.mp3", "sha256": "10b93cf6ab9bbddbf24e6867816337fde2da7ab18ca0942186178e58bbf7c021"}, {"id": "NPC_MERCHANT_ACTIVE_1", "speaker": "merchant", "role": "김 영감 · 노장 C", "text": "굴에 드실 채비는 하셨수? 탕약 두 병은 챙겨 가시오.", "file": "audio/merchant/NPC_MERCHANT_ACTIVE_1.mp3", "sha256": "b537fe4994c073a1838eaf3a0953a52d9ced670a202910161454940f00a1fa41"}, {"id": "NPC_MERCHANT_ACTIVE_2", "speaker": "merchant", "role": "김 영감 · 노장 C", "text": "다녀오시면 내가 한잔 사리다. …장터가 열리면.", "file": "audio/merchant/NPC_MERCHANT_ACTIVE_2.mp3", "sha256": "8f02f58897565541076400c7b67d5376a828d7b9388e13724f14f0a79d619711"}, {"id": "NPC_MERCHANT_AFTER_1", "speaker": "merchant", "role": "김 영감 · 노장 C", "text": "장터가 다시 열릴 기미가… 보이네. 고맙수, 도사.", "file": "audio/merchant/NPC_MERCHANT_AFTER_1.mp3", "sha256": "46ccad8a89611ae76c308cd3f8c33f2da1ecf49f8c3b99dee434525d0ab80965"}, {"id": "NPC_MERCHANT_GREET_1", "speaker": "merchant", "role": "김 영감 · 노장 C", "text": "도사 양반, 갓끈이 풀렸수. 한 번 봐드릴까?", "file": "audio/merchant/NPC_MERCHANT_GREET_1.mp3", "sha256": "3749ecc9be3c4d328de3b279522f185a3567f2730c1e6bc8ec097c02d1542740"}, {"id": "NPC_MERCHANT_GREET_2", "speaker": "merchant", "role": "김 영감 · 노장 C", "text": "오늘은 부적이 잘 안 팔리네. 도사 양반이라도 한 장…", "file": "audio/merchant/NPC_MERCHANT_GREET_2.mp3", "sha256": "9960b24649f4687c97f2ba4aa747a58736fdb2d0ee6516dddec9ac5a5334ce9a"}, {"id": "NPC_MERCHANT_GREET_3", "speaker": "merchant", "role": "김 영감 · 노장 C", "text": "굴에서 건진 건 다 사 드리우. 값은… 뭐, 시세대로.", "file": "audio/merchant/NPC_MERCHANT_GREET_3.mp3", "sha256": "1a7a9730a9fd1df16e5286e7b338f2ca389da5e7829da5591ce80d60d2f687ce"}, {"id": "NPC_MERCHANT_GREET_4", "speaker": "merchant", "role": "김 영감 · 노장 C", "text": "술 찾으시우? 장터가 닫혀서 술은 없수. 물은 있지. …물은 공짜여.", "file": "audio/merchant/NPC_MERCHANT_GREET_4.mp3", "sha256": "cb6b28de3a947b75b59b2b3b210d1fd291081d94e6607ed8310eb7d603cf4479"}, {"id": "NPC_MERCHANT_GREET_5", "speaker": "merchant", "role": "김 영감 · 노장 C", "text": "갓이야 덤으로 줘도 검 값은 못 깎아 주우. 목숨값이니.", "file": "audio/merchant/NPC_MERCHANT_GREET_5.mp3", "sha256": "bc10c94e31f0d78994554a281d336dad6926b7cc890fe08e28720fe54ade240e"}, {"id": "NPC_MERCHANT_VOUCH_1", "speaker": "merchant", "role": "김 영감 · 노장 C", "text": "주모 만나셨수? 그 사람 국밥이 못골에서 제일이우. 그 사람 없었으면 이 장터, 석 달 전에 죽었수.", "file": "audio/merchant/NPC_MERCHANT_VOUCH_1.mp3", "sha256": "685cd152904e4eadb8265d8f0c1e3856249f6c8ca83201c98e995f574eac5d29"}, {"id": "NPC_MERCHANT_HINT_G08_1", "speaker": "merchant", "role": "김 영감 · 노장 C", "text": "괴황지를 주우셨수? 부적 쓰는 누런 종이우. 두 장에 붉은 경면주사 하나를 얹어 도깨비한테 맡겨 보시우.", "file": "audio/merchant/NPC_MERCHANT_HINT_G08_1.mp3", "sha256": "87d175ff1c5067d94fbe255e162cf282285eb425bc3b14aa67cfa521932133a8"}, {"id": "NPC_MERCHANT_HINT_G08_2", "speaker": "merchant", "role": "김 영감 · 노장 C", "text": "석 장짜리 식별부든 한 장짜리 귀환부든 고르기는 도사 양반 마음이우. 내 밥줄 걸린 소리니 소문은 내지 마시우.", "file": "audio/merchant/NPC_MERCHANT_HINT_G08_2.mp3", "sha256": "f736754071dfa9effffef15207c1b91f99c389f5766967eab20b408f7e3c5b25"}, {"id": "NPC_MERCHANT_HINT_G08_3", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "영감 장사엔 해로운 얘기구먼.", "file": "audio/doho/NPC_MERCHANT_HINT_G08_3.mp3", "sha256": "0ec7f33a95d79861f5ce8cccb620a9ad92f7b2a96ab6c3ed0d0f5e2eac63e7b7"}, {"id": "NPC_SHAMAN_OFFER_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "도사 양반, 늦었소. 못골이 석 달째 이 꼴이오.", "file": "audio/shaman/NPC_SHAMAN_OFFER_1.mp3", "sha256": "215d1cfa231518caecad59a303dabc82b4e7b6187dd29850e894195c778d6c8d"}, {"id": "NPC_SHAMAN_OFFER_2", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "할매, 술부터… 아, 분위기 아니구먼.", "file": "audio/doho/NPC_SHAMAN_OFFER_2.mp3", "sha256": "fdac7fb8e4fad94a4e82d49c4c2f7a5744047f92ab85c3355049011e8abc7c07"}, {"id": "NPC_SHAMAN_OFFER_3", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "봉인이 흔들리오. 요사한 기운이 못골로 새고 있소.", "file": "audio/shaman/NPC_SHAMAN_OFFER_3.mp3", "sha256": "4140f9f0b74263732a7d855c49d933b69d55a2ca8438d481a2c2ca2ab48d17c7"}, {"id": "NPC_SHAMAN_OFFER_3B", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "꼬리 아홉 달린 천 년 묵은 여우, 구미호가 깨어났소.", "file": "audio/shaman/NPC_SHAMAN_OFFER_3B.mp3", "sha256": "8459be5021a062769e689eae77ed43f63acbf84164a037113db1936f8eb7ba35"}, {"id": "NPC_SHAMAN_OFFER_3C", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "그 수하가 들녘 너머 흑랑 굴에 들어앉았소.", "file": "audio/shaman/NPC_SHAMAN_OFFER_3C.mp3", "sha256": "95c50328f3dc3ccfc72eb3bb2f44ea3bd7a3b0f738aa1d6e269a87614af858b4"}, {"id": "NPC_SHAMAN_OFFER_4", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "마을 북쪽 산길 끝 봉밀굴 문 안엔 구미호가 갇혀 있소. …아직 열 때가 아니오.", "file": "audio/shaman/NPC_SHAMAN_OFFER_4.mp3", "sha256": "7bf2b39dd4d828048cc6f2eb8b4b2cbf597f06ab7925268db913c689dd888992"}, {"id": "NPC_SHAMAN_OFFER_5", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "…또 봉인이여.", "file": "audio/doho/NPC_SHAMAN_OFFER_5.mp3", "sha256": "ebb768c26cf9f63a70cfbd337d59365b7057daafa97c8caed1bb3be706ffc081"}, {"id": "NPC_SHAMAN_OFFER_6", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "도사 양반밖에 없소. 장터 어귀에 주모가 있소. 길은 그 사람이 아오.", "file": "audio/shaman/NPC_SHAMAN_OFFER_6.mp3", "sha256": "898ce6b6cfafc9a18d106a750379f9d8c24f0b030ba976f8f3ed6849c77fc30e"}, {"id": "NPC_SHAMAN_OFFER_7", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "술값은—", "file": "audio/doho/NPC_SHAMAN_OFFER_7.mp3", "sha256": "6703a266f2767d28668f8a92b71da7674a59da97b066453b334c2bb175f171d0"}, {"id": "NPC_SHAMAN_OFFER_8", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "살아서 돌아오면 쳐 드리리다.", "file": "audio/shaman/NPC_SHAMAN_OFFER_8.mp3", "sha256": "602813b719e644d5d25dbcee503264347ffb4117b2dc9668a0b36914e0e0e4b6"}, {"id": "NPC_SHAMAN_OFFER_9", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "…허. 하는 김에.", "file": "audio/doho/NPC_SHAMAN_OFFER_9.mp3", "sha256": "880a71f14cfe5391961ec8df8b2030ac565310b019289d9f055342ff61a9e1f5"}, {"id": "NPC_SHAMAN_HEAL_INTRO_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "가기 전에 몸부터 채워 드리리다. 말만 걸면 되오. 값은 안 받소.", "file": "audio/shaman/NPC_SHAMAN_HEAL_INTRO_1.mp3", "sha256": "d71624520daf85a4a04d0889f902e76b71aa13c49ac5c22dd6920b4c83c9d961"}, {"id": "NPC_SHAMAN_PROGRESS_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "아직이오? 길은 주모가 알려 주었을 터인데.", "file": "audio/shaman/NPC_SHAMAN_PROGRESS_1.mp3", "sha256": "d60bd8028a7f0e901e29ec34c71290138cff5eeb6397ea7897f3b9d18fb8e4d1"}, {"id": "NPC_SHAMAN_PROGRESS_2", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "탕약은 챙겼소? 김 영감네 가보시오.", "file": "audio/shaman/NPC_SHAMAN_PROGRESS_2.mp3", "sha256": "a9e889657a0cead42c67f4b5877a074adf14375530905872880cf74f4ce6020e"}, {"id": "NPC_SHAMAN_NUDGE_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "주모는 만나 보았소? 길은 그 사람한테 물으시오.", "file": "audio/shaman/NPC_SHAMAN_NUDGE_1.mp3", "sha256": "0c67329a127b5421a28a33b70124814c8e532c0b1bb8d837ee1876142494b890"}, {"id": "NPC_SHAMAN_DONE_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "…왔구려.", "file": "audio/shaman/NPC_SHAMAN_DONE_1.mp3", "sha256": "a6eb932e5782e783bd789c6d020e2f0d075c2eb9cd49336edd5487d32fd2033d"}, {"id": "NPC_SHAMAN_PROXY_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "주모가 자리를 비웠으니 내가 대신 받겠소.", "file": "audio/shaman/NPC_SHAMAN_PROXY_1.mp3", "sha256": "bce6a03a49c329c5f5e67d85081a8ca82e9674cdb98d5bbdeff278e40232869b"}, {"id": "NPC_SHAMAN_DONE_2", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "끝낸 것 같기도 하고.", "file": "audio/doho/NPC_SHAMAN_DONE_2.mp3", "sha256": "e1ea076060b30a1a453f22f40eda4e5c7388b0ebff295b2868616beb94d12cc5"}, {"id": "NPC_SHAMAN_DONE_3", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "봉인 기운이 달라졌소. 고맙소, 도사 양반.", "file": "audio/shaman/NPC_SHAMAN_DONE_3.mp3", "sha256": "0d7b2d2a41421b95eb9256f243c145d1a8bb90b7405e592dc9330e9e0de0a051"}, {"id": "NPC_SHAMAN_REPORT_3", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "봉인의 금이 세 군데 다 아물었소. 한동안은 버틸 거요.", "file": "audio/shaman/NPC_SHAMAN_REPORT_3.mp3", "sha256": "2134b6a5f7ccebcc24a88f3c23f8185de714e378eff91f37f1311a3aa0d6fc78"}, {"id": "NPC_SHAMAN_REPORT_2", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "봉인의 금이 두 군데 아물었소. 한동안은 버틸 거요.", "file": "audio/shaman/NPC_SHAMAN_REPORT_2.mp3", "sha256": "21d70ed3fed3184ee6922aed2193105fbb4edb2e3e3db1ac8169f61a751a772d"}, {"id": "NPC_SHAMAN_TAVERN_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "들녘 옛 주막 터 일이오? 주모가 맡긴 일이라 들었소. 내가 대신 듣겠소.", "file": "audio/shaman/NPC_SHAMAN_TAVERN_1.mp3", "sha256": "ee44b7e4bfdc9c72550b7c042a788faaf51e8a11f941a22da42ccb2d6dbde662"}, {"id": "NPC_SHAMAN_TAVERN_2", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "…그 터 울음이 그쳤다니, 잘했소. 오래 시끄러운 자리였지.", "file": "audio/shaman/NPC_SHAMAN_TAVERN_2.mp3", "sha256": "059aa97f9b74604c82f6fba86a5b50d9b4d1c57224a27c587f16e4dbd8e96afb"}, {"id": "NPC_SHAMAN_AFTER_LORE_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "손에 든 그 조각은 봉밀굴 문에 걸려 있던 봉인의 한 쪽이오. 옛 도사들이 구미호를 가두며 패와 고리, 사슬 셋으로 나눠 걸었지.", "file": "audio/shaman/NPC_SHAMAN_AFTER_LORE_1.mp3", "sha256": "935972a6269b686fb4b0e262b2ce2a5124cdfc751b20227bcb02688b2c30673b"}, {"id": "NPC_SHAMAN_AFTER_LORE_2", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "봉인이 낡아 금이 가자, 구미호가 그걸 거꾸로 걸어 제 굴 문을 잠그고 세 쪽을 흩어 놨소. 셋이 다시 모여야 문이 열리오.", "file": "audio/shaman/NPC_SHAMAN_AFTER_LORE_2.mp3", "sha256": "fada32fc61b27d98752f4ed298d7048dcdd57e04f0a6464f3132358091813430"}, {"id": "NPC_SHAMAN_AFTER_LORE_4", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "남의 자물쇠로 제 집 문을 잠갔구먼. 열쇠는 개한테 범한테 쇠 먹는 놈 뱃속에 맡겨 놓고. 뻔뻔하기는.", "file": "audio/doho/NPC_SHAMAN_AFTER_LORE_4.mp3", "sha256": "49beae88e3fe4deadce1cd1f5f53c8c421ba0277a18e5b1628bd684040a2e9a3"}, {"id": "NPC_SHAMAN_AFTER_SRC_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "열쇠라 했소? 그건 봉인이오. …굴마다 한 쪽씩 있는 줄은 나도 몰랐소. 누구한테 들었소?", "file": "audio/shaman/NPC_SHAMAN_AFTER_SRC_1.mp3", "sha256": "7737e6ac106f334fc1a251229ef5dad447c39278b26fb404731d11dde0a5872c"}, {"id": "NPC_SHAMAN_AFTER_SRC_2", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "주모가. 목로엔 소문이 다 모이잖수.", "file": "audio/doho/NPC_SHAMAN_AFTER_SRC_2.mp3", "sha256": "31633eb0eb0bbf6f850af3e57cfb2549b3335990f45090a9ef3dee21ac1abfd3"}, {"id": "NPC_SHAMAN_AFTER_SRC_3", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "…그렇소.", "file": "audio/shaman/NPC_SHAMAN_AFTER_SRC_3.mp3", "sha256": "f1340dc6ecc0be2cfcb81c786622521a0037289dfd2e8fd3854e3a2d4fa28747"}, {"id": "NPC_SHAMAN_AFTER_ALL_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "세 굴을 다 비웠구려. 이제 남은 건 봉밀굴뿐이오. 문을 열 때가 왔소.", "file": "audio/shaman/NPC_SHAMAN_AFTER_ALL_1.mp3", "sha256": "4154b0cc6a49d3d248ddf75a6c1aedb144580ae09039025ee1e56fc4e3f9eb3a"}, {"id": "NPC_SHAMAN_AFTER_ALL_2", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "…드디어.", "file": "audio/doho/NPC_SHAMAN_AFTER_ALL_2.mp3", "sha256": "9d4df6a1f3f89a2a7973c520428163c28169880974a9e3f2a8efbfb86b6663bc"}, {"id": "NPC_SHAMAN_AFTER_ALL_3", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "마을 북쪽 산길 끝 돌문이 봉밀굴 문이오. 조각 셋을 대면 열릴 거요.", "file": "audio/shaman/NPC_SHAMAN_AFTER_ALL_3.mp3", "sha256": "69300f1b0685412faab8845853b11b054600f5545c10f45b717c0317e960779c"}, {"id": "NPC_SHAMAN_AFTER_HAND_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "다만 그 문은 도력 있는 손으로만 열리오. 요괴는 조각을 쥘 수는 있어도 대지는 못하지.", "file": "audio/shaman/NPC_SHAMAN_AFTER_HAND_1.mp3", "sha256": "1abc4aaca85fe581bf0e88e9d86603c7a72c03ff91e3e42e49eeab431f4aaf0d"}, {"id": "NPC_SHAMAN_WARN_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "하나만 일러 두겠소. 문 안에서 낯익은 얼굴을 보거든 놀라지 마시오.", "file": "audio/shaman/NPC_SHAMAN_WARN_1.mp3", "sha256": "bdfbe789b808396d60afa0ce517fad16b01a86b6e254972589518f61eab8aca9"}, {"id": "NPC_SHAMAN_WARN_2", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "떠돌이한테 낯익은 얼굴이야 천지지.", "file": "audio/doho/NPC_SHAMAN_WARN_2.mp3", "sha256": "7af0c4b92e6cab6d9c3f494c5c6fa8d305fdd31e9727914aa671dd23d36342fd"}, {"id": "NPC_SHAMAN_AFTER_LAST_HEUK_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "이제 남은 건 들녘 흑랑 굴 하나요.", "file": "audio/shaman/NPC_SHAMAN_AFTER_LAST_HEUK_1.mp3", "sha256": "2bfaa8c233f8ba25deef8dc8b36056717893ffae0e1caf93117a4688dcf48bfc"}, {"id": "NPC_SHAMAN_AFTER_LAST_HEUK_2", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "흑랑은 불개요. 해와 달도 물어 삼키려던 놈이니, 달려드는 걸 조심하시오.", "file": "audio/shaman/NPC_SHAMAN_AFTER_LAST_HEUK_2.mp3", "sha256": "177a136d11d84cdc6077505554e176527e52dfe53fb4d05cf928dcabc104566d"}, {"id": "NPC_SHAMAN_AFTER_LAST_HEUK_3", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "그래 봐야 강아지 한 마리구먼.", "file": "audio/doho/NPC_SHAMAN_AFTER_LAST_HEUK_3.mp3", "sha256": "1f4c40fb34bb6432095c43b2a414b71d5a18e6eebeaa572bea63a1616bb52243"}, {"id": "NPC_SHAMAN_AFTER_LAST_BEOM_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "이제 남은 건 정령재 범굴 하나요.", "file": "audio/shaman/NPC_SHAMAN_AFTER_LAST_BEOM_1.mp3", "sha256": "104a77c37d275c71ce21afbb5984cec8b463a5c15c616cd6688b5539aa3924c7"}, {"id": "NPC_SHAMAN_AFTER_LAST_BEOM_2", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "굴 안에서 누가 도사 양반 이름을 부르거든, 그건 사람이 아니오.", "file": "audio/shaman/NPC_SHAMAN_AFTER_LAST_BEOM_2.mp3", "sha256": "f9371d0c2870b88ebd395f79ebba70191b10c01515954b1c1d8662f6eebcc048"}, {"id": "NPC_SHAMAN_AFTER_LAST_BEOM_3", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "내 이름 부를 사람이 이 동네에 또 있었나.", "file": "audio/doho/NPC_SHAMAN_AFTER_LAST_BEOM_3.mp3", "sha256": "c4793c20ace398f6d42397fbb6479e97ed5882a2bd36e5208bb0ac41a8a82352"}, {"id": "NPC_SHAMAN_AFTER_LAST_SOE_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "이제 남은 건 정령재 쇠부리 폐광 하나요.", "file": "audio/shaman/NPC_SHAMAN_AFTER_LAST_SOE_1.mp3", "sha256": "0157652fbc5906f90700344ece7d8b5d070366f7f40834f91a551559aecde287"}, {"id": "NPC_SHAMAN_AFTER_LAST_SOE_2", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "쇠 냄새가 짙은 곳이오. 검이 안 들거든 불을 쓰시오. 내 좌판에 화염부가 있소.", "file": "audio/shaman/NPC_SHAMAN_AFTER_LAST_SOE_2.mp3", "sha256": "817ad3c5659a13f246948a36eea318115677eefd284be54ac168d0ebddbf96b7"}, {"id": "NPC_SHAMAN_AFTER_LAST_SOE_3", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "검 대신 불이라… 부적값이 또 나가겠구먼.", "file": "audio/doho/NPC_SHAMAN_AFTER_LAST_SOE_3.mp3", "sha256": "7aedca33621e18a7f32dd764db5aac73de569fe26ee28080e92c9a999d23889a"}, {"id": "NPC_SHAMAN_SMELL_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "…그러고 보니 주모가 요새 통 안 보이는구려.", "file": "audio/shaman/NPC_SHAMAN_SMELL_1.mp3", "sha256": "9a2804775716c0bc00dfe30407d07d90c38044dcabb0eb87c206861c3f33c722"}, {"id": "NPC_SHAMAN_SMELL_2", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "그 사람한테선 사람 냄새가 너무 진하오. 일부러 덧칠한 것처럼.", "file": "audio/shaman/NPC_SHAMAN_SMELL_2.mp3", "sha256": "2e7962600fc4160300ea9516d53bb46c0160c1e56f21b675136879e21585443c"}, {"id": "NPC_SHAMAN_SMELL_3", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "국솥 김이 진해서 그렇겠지.", "file": "audio/doho/NPC_SHAMAN_SMELL_3.mp3", "sha256": "c302301690b1079f5d523d595e1c8033b7a358ae9d63790fbdaf0028dd0db7ad"}, {"id": "NPC_SHAMAN_GREET_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "도사 양반, 봉인이 또 흔들렸소. 길은 주모네 목로에서 물으시오.", "file": "audio/shaman/NPC_SHAMAN_GREET_1.mp3", "sha256": "4fc6497eee04ad1562dccc26b90e82b556f87ab626ab03a41f0a1d1460380734"}, {"id": "NPC_SHAMAN_GREET_2", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "못골 공기가 무겁소. 말만 하다 갈 때가 아니오. 주모네 목로부터 들르시오.", "file": "audio/shaman/NPC_SHAMAN_GREET_2.mp3", "sha256": "5342a055cbe08dcb493a2a31c216f7426e6b26fb8d6e77bee4125b8f9a930bc5"}, {"id": "NPC_SHAMAN_GREET_3", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "구미호 일은 아직 끝나지 않았소. 방심 마시오. 주모네 목로에서 길을 물으시오.", "file": "audio/shaman/NPC_SHAMAN_GREET_3.mp3", "sha256": "e284293ca6e3815610264a0744993858b344087dc753ee52fc3adc9baf0e0484"}, {"id": "NPC_SHAMAN_GREET_4", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "굴에서 건져 온 물건은 기운을 읽어야 쓸 수 있소. 감정은 내가 해 주리다.", "file": "audio/shaman/NPC_SHAMAN_GREET_4.mp3", "sha256": "710a1adc24aab78fac4ade24c00305db3a04ceaea37f944de209b0304d5e2fa9"}, {"id": "NPC_SHAMAN_REPEAT_4", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "북쪽 돌문이 기다리오. 말은 그만, 가시오.", "file": "audio/shaman/NPC_SHAMAN_REPEAT_4.mp3", "sha256": "3775ab9edd306e40fc79bfe33cbdf4ef2ea89956af22e92332c22ba0de0ee7ab"}, {"id": "NPC_SHAMAN_REPEAT_3", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "남은 굴 하나가 기다리오. 말은 그만, 가시오.", "file": "audio/shaman/NPC_SHAMAN_REPEAT_3.mp3", "sha256": "28310aa673eb2cde2fdfff2f97190fd5314af736b4abfb94ec8cfcd0724d8438"}, {"id": "NPC_SHAMAN_REPEAT_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "말은 그만. 굴로 가시오.", "file": "audio/shaman/NPC_SHAMAN_REPEAT_1.mp3", "sha256": "0a4c6b0f428fda21f10a17cd94248e94931977a6624a1c0fbc478bedceac5138"}, {"id": "NPC_SHAMAN_REPEAT_2", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "…술 이야기는 나중에.", "file": "audio/shaman/NPC_SHAMAN_REPEAT_2.mp3", "sha256": "f06356a74970ed2b7cb51aed82a12e6d1feccee1d02fcaed5f219de5973b126e"}, {"id": "NPC_SHAMAN_IDENTIFY_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "이건… 봉인 너머의 기운이 묻어 있구먼.", "file": "audio/shaman/NPC_SHAMAN_IDENTIFY_1.mp3", "sha256": "b1ce9ed77827e3a33795d437b2bbadc8c72e86713cf0ae4e781815b3e67a2ffb"}, {"id": "NPC_SHAMAN_IDENTIFY_2", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "엽전이 모자라오. 수수료는 식별부보다 싸도 공짜는 아니오. 잔소리는 덤이오.", "file": "audio/shaman/NPC_SHAMAN_IDENTIFY_2.mp3", "sha256": "360f43d97548e7f6afb97c73f62a1376ed139cda59f2ad03fb836e924c9ca139"}, {"id": "NPC_SHAMAN_HINT_MANSA_1", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "만사와 형통이라… 글귀를 반으로 쪼갠 것이오. 만사가 형통하라는 말은 칼에 새기는 거요.", "file": "audio/shaman/NPC_SHAMAN_HINT_MANSA_1.mp3", "sha256": "34c8fcef661d8975652577ad80d686cbbf9c157afe3d7c3a195540d45befd6e1"}, {"id": "NPC_SHAMAN_HINT_MANSA_2", "speaker": "shaman", "role": "무당 할매 · 노파 B", "text": "앞뒤를 바꾸면 글이 아니라 낙서가 되오. 순서를 지키시오.", "file": "audio/shaman/NPC_SHAMAN_HINT_MANSA_2.mp3", "sha256": "856fc71895b6c5998b7d50d793118b8f19d64f623292c5328c353515679c1d22"}, {"id": "NPC_SHAMAN_HINT_MANSA_3", "speaker": "doho", "role": "도호 · K-Actor Lee", "text": "칼에 소원을 새기라… 팔자 좋은 칼이구먼.", "file": "audio/doho/NPC_SHAMAN_HINT_MANSA_3.mp3", "sha256": "3778717d4496fd3d90c4a172a784bc069dcc8c4224de06bf6fb075303f84f3ce"}], "cast": {"card": 613, "approved_casting_card": 608, "generated_by": "codex", "model": "eleven_v4", "roles": [{"id": "doho", "name": "도호 · K-Actor Lee", "voice_id": "v1is6KLMuZWgumQgKSOi"}, {"id": "elder", "name": "촌장 · 노년 B", "voice_id": "s4H03ZZyLWvCo7Z3vvPm"}, {"id": "merchant", "name": "김 영감 · 노장 C", "voice_id": "pV5F1V6WTBQmi56Q6kfj"}, {"id": "shaman", "name": "무당 할매 · 노파 B", "voice_id": "2TBd92uNP6wUTgcM1kLF"}, {"id": "jumo", "name": "주모 / 구미호 · 농밀 B", "voice_id": "f4LjOjvSdOz7EHnjfyG9"}, {"id": "dokkaebi", "name": "도깨비 · 거한 C", "voice_id": "RuWAHOtWIWeV7IdAQxY5"}, {"id": "iksoe", "name": "억쇠 · Jae-seong (정적 대본 미등록)", "voice_id": "TRO4gatqxbbwLXHLDLSk"}]}}</script><script>const data=JSON.parse(document.querySelector('#payload').textContent),$=s=>document.querySelector(s),audio=$('#audio');let filtered=[],queue=[],i=0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));audio.volume=.75;function stop(){queue=[];audio.pause();audio.removeAttribute('src');audio.load();$('#now').textContent='재생 정지'}async function next(){if(i>=queue.length)return;const r=queue[i];audio.src=r.file;$('#now').textContent=r.role+' / '+r.id+' · '+(i+1)+'/'+queue.length;try{await audio.play()}catch{$('#now').textContent='재생 버튼을 다시 눌러주세요'}}function play(rows){stop();queue=rows;i=0;next()}audio.onended=()=>{i++;if(i<queue.length)next();else $('#now').textContent+=' · 끝'};audio.onerror=()=>$('#now').textContent='오디오 연결을 확인해 주세요';function render(){const q=$('#search').value.toLowerCase(),role=$('#role').value;filtered=data.rows.filter(r=>(role==='all'||r.speaker===role)&&(!q||(r.text+' '+r.id).toLowerCase().includes(q)));$('#count').textContent=filtered.length+'줄';$('#lines').innerHTML=filtered.map(r=>`<article><button data-id="${esc(r.id)}">▶ 재생</button><small>${esc(r.role)} · ${esc(r.id)}</small><p>${esc(r.text)}</p></article>`).join('')}data.cast.roles.forEach(r=>{$('#cast').insertAdjacentHTML('beforeend',`<div>${esc(r.name)}</div>`);$('#role').insertAdjacentHTML('beforeend',`<option value="${esc(r.id)}">${esc(r.name)}</option>`)});document.addEventListener('click',e=>{let id=e.target.closest('button')?.dataset.id;if(id)play([data.rows.find(r=>r.id===id)])});$('#role').onchange=$('#search').oninput=render;$('#playall').onclick=()=>play(filtered);$('#stop').onclick=stop;render();</script></html>
